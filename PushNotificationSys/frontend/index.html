<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="alternate icon" href="/vite.svg" />
    <link rel="apple-touch-icon" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <title>Push Notification System - Enterprise Console</title>
    <!-- Early theme initialization to prevent flash of wrong theme on initial splash screen -->
    <script>
      ;(function () {
        try {
          const stored = localStorage.getItem('bronx_theme')
          const prefersDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          if (stored === 'dark' || ((!stored || stored === 'system') && prefersDark)) {
            document.documentElement.classList.add('dark')
          } else {
            document.documentElement.classList.remove('dark')
          }
        } catch (_) {}
      })()
    </script>
    <!-- Daily Companion App neutralizing script -->
    <script>
      ;(function () {
        if (typeof document !== 'undefined' && !document.querySelector('daily-companion-app')) {
          const el = document.createElement('daily-companion-app')
          el.id = 'daily-companion-app'
          el.className = 'daily-companion-app'
          el.style.display = 'none'
          ;(document.head || document.documentElement).appendChild(el)
        }
      })()
    </script>
    <style id="app-splash-styles">
      :root {
        --splash-bg: #f8fafc;
        --splash-title: #0f172a;
        --splash-sub: #64748b;
        --splash-track: rgba(226, 232, 240, 0.9);
        --splash-aura: rgba(99, 102, 241, 0.14);
        --splash-ring: rgba(99, 102, 241, 0.35);
      }
      html.dark {
        --splash-bg: #0b0f19;
        --splash-title: #f8fafc;
        --splash-sub: #94a3b8;
        --splash-track: rgba(30, 41, 59, 0.9);
        --splash-aura: rgba(99, 102, 241, 0.28);
        --splash-ring: rgba(99, 102, 241, 0.55);
      }
      #app-splash-screen {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: var(--splash-bg);
        color: var(--splash-title);
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
        transition:
          opacity 0.35s ease,
          transform 0.35s ease;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      #app-splash-screen.splash-fade-out {
        opacity: 0;
        transform: scale(1.02);
        pointer-events: none;
      }
      .splash-bg-dots {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image: radial-gradient(rgba(99, 102, 241, 0.8) 1px, transparent 1px);
        background-size: 24px 24px;
        opacity: 0.04;
      }
      html.dark .splash-bg-dots {
        opacity: 0.08;
      }
      .splash-glow-aura {
        position: absolute;
        width: 320px;
        height: 320px;
        border-radius: 9999px;
        background: radial-gradient(circle, var(--splash-aura) 0%, transparent 70%);
        filter: blur(36px);
        pointer-events: none;
        transform: translateY(-20px);
        animation: splash-aura-pulse 2.5s ease-in-out infinite;
      }
      .splash-card {
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 0 24px;
        max-width: 420px;
        width: 100%;
      }
      .splash-beacon-wrap {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
        width: 72px;
        height: 72px;
      }
      /* 6 Active Concentric Round Borders Wrapping the Logo */
      .splash-round-border {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 72px;
        height: 72px;
        margin-top: -36px;
        margin-left: -36px;
        border-radius: 9999px;
        pointer-events: none;
        box-sizing: border-box;
        transform-origin: center center;
        border: 1.5px solid rgba(99, 102, 241, 0.45);
        animation: splash-radar-ripple 2.4s cubic-bezier(0.15, 0.3, 0.4, 1) infinite;
        animation-fill-mode: both;
      }
      .splash-round-border-1 {
        animation-delay: 0s;
      }
      .splash-round-border-2 {
        animation-delay: -0.4s;
      }
      .splash-round-border-3 {
        animation-delay: -0.8s;
      }
      .splash-round-border-4 {
        animation-delay: -1.2s;
      }
      .splash-round-border-5 {
        animation-delay: -1.6s;
      }
      .splash-round-border-6 {
        animation-delay: -2.0s;
      }

      html.dark .splash-round-border {
        border-color: rgba(129, 140, 248, 0.6);
      }
      .splash-logo-container {
        position: relative;
        z-index: 2;
        width: 72px;
        height: 72px;
        border-radius: 24px;
        background: linear-gradient(135deg, #4f46e5 0%, #6366f1 50%, #38bdf8 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 16px 36px -6px rgba(79, 70, 229, 0.4);
        outline: 4px solid rgba(99, 102, 241, 0.2);
      }
      .splash-logo-container svg {
        width: 38px;
        height: 38px;
        color: #ffffff;
        stroke-width: 2.2;
      }
      .splash-pill-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 10px;
        border-radius: 9999px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        background: rgba(99, 102, 241, 0.1);
        color: #6366f1;
        border: 1px solid rgba(99, 102, 241, 0.25);
        margin-bottom: 8px;
      }
      html.dark .splash-pill-badge {
        background: rgba(99, 102, 241, 0.18);
        color: #818cf8;
        border-color: rgba(99, 102, 241, 0.35);
      }
      .splash-live-dot {
        width: 6px;
        height: 6px;
        border-radius: 9999px;
        background-color: #10b981;
        animation: splash-pulse-dot 1.4s ease-in-out infinite;
      }
      .splash-title-text {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.025em;
        color: var(--splash-title);
        line-height: 1.2;
      }
      .splash-sub-text {
        font-size: 13px;
        font-weight: 500;
        color: var(--splash-sub);
        margin-top: 4px;
      }
      .splash-track {
        width: 220px;
        height: 5px;
        background-color: var(--splash-track);
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
        margin-top: 24px;
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.05);
      }
      .splash-bar {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 50%;
        border-radius: 9999px;
        background: linear-gradient(90deg, #4f46e5, #6366f1, #38bdf8);
        box-shadow: 0 0 12px rgba(99, 102, 241, 0.6);
        animation: splash-shimmer-run 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .splash-status-message {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 500;
        color: var(--splash-sub);
        margin-top: 14px;
      }
      .splash-spinner-dot {
        width: 6px;
        height: 6px;
        border-radius: 9999px;
        background-color: #6366f1;
        animation: splash-pulse-dot 1.2s ease-in-out infinite;
      }
      @keyframes splash-radar-ripple {
        0% {
          transform: scale(0.9);
          opacity: 0.95;
          border-width: 2px;
          border-color: rgba(99, 102, 241, 0.55);
        }
        35% {
          opacity: 0.7;
          border-color: rgba(99, 102, 241, 0.4);
        }
        70% {
          opacity: 0.3;
          border-color: rgba(99, 102, 241, 0.2);
        }
        100% {
          transform: scale(4.8);
          opacity: 0;
          border-width: 1px;
          border-color: rgba(99, 102, 241, 0);
        }
      }
      @keyframes splash-shimmer-run {
        0% {
          transform: translateX(-150%);
        }
        50% {
          transform: translateX(100%);
        }
        100% {
          transform: translateX(250%);
        }
      }
      @keyframes splash-aura-pulse {
        0%,
        100% {
          opacity: 0.8;
          transform: translateY(-20px) scale(1);
        }
        50% {
          opacity: 1;
          transform: translateY(-20px) scale(1.08);
        }
      }
      @keyframes splash-pulse-dot {
        0%,
        100% {
          opacity: 0.4;
          transform: scale(0.85);
        }
        50% {
          opacity: 1;
          transform: scale(1.25);
        }
      }
    </style>
  </head>
  <body>
    <!-- Neutralizes third-party browser extension (e.g. daily.dev companion) react-modal selector query -->
    <daily-companion-app
      id="daily-companion-app"
      class="daily-companion-app"
      style="display: none"
    ></daily-companion-app>

    <!-- Instant Pre-mount Splash Screen (First Load) -->
    <div id="app-splash-screen" role="status" aria-label="Loading Push Notification System">
      <div class="splash-bg-dots"></div>
      <div class="splash-glow-aura"></div>
      <div class="splash-card">
        <div class="splash-beacon-wrap">
          <!-- 6 Concentric Round Borders Wrapping Logo -->
          <div class="splash-round-border splash-round-border-1"></div>
          <div class="splash-round-border splash-round-border-2"></div>
          <div class="splash-round-border splash-round-border-3"></div>
          <div class="splash-round-border splash-round-border-4"></div>
          <div class="splash-round-border splash-round-border-5"></div>
          <div class="splash-round-border splash-round-border-6"></div>

          <div class="splash-logo-container">
            <!-- Push Notification Bell with radiating signal rings -->
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path>
              <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path>
              <path d="M4 2C1.5 4.5 1 8 1 8" stroke-dasharray="2 2" stroke-opacity="0.7"></path>
              <path d="M20 2c2.5 2.5 3 6 3 6" stroke-dasharray="2 2" stroke-opacity="0.7"></path>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <!-- Main Vue App Mount Point -->
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
